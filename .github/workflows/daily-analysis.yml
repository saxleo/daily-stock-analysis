name: 每日股票分析

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - run: mkdir -p data logs reports
      - env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          MARKET_REVIEW_ENABLED: 'true'
        run: |
  if [ "${{ github.event.inputs.mode }}" == "market-only" ]; then
    python main.py --market-review --force-run
  elif [ "${{ github.event.inputs.mode }}" == "stocks-only" ]; then
    python main.py --no-market-review --force-run
  else
    python main.py --force-run
  fi
